name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, dependencias, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm turbo run lint typecheck test build
        env:
          # El build no llama a Supabase; los valores solo deben existir.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    name: pgTAP contra una base local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: Playwright a 390 px
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      # F3, F4 y F6: cuentas, reserva y panel contra Supabase local con la semilla. Postgres,
      # Auth, PostgREST, Kong, Mailpit (correos de activación y de contraseña), Realtime (F4: la
      # hora que toma otro desaparece sin recargar; F6: la agenda en vivo) y Storage (F6: foto y
      # portafolio del barbero).
      - name: Supabase local
        run: supabase start -x imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Variables de Supabase local
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
          # F8: la ruta de despacho lee citas con la clave secreta de esta base de CI y exige el
          # secreto de la semilla (supabase/seed.sql).
          echo "SUPABASE_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          echo "CRON_SECRET=solo-local-despacho" >> "$GITHUB_ENV"
      # F8: claves VAPID desechables, nuevas en cada corrida ("Avisos" en "Más" las necesita).
      - name: Claves VAPID de prueba
        run: |
          pnpm --filter @possos/notifications exec web-push generate-vapid-keys --json > /tmp/vapid.json
          node -e 'const k=require("/tmp/vapid.json");console.log("NEXT_PUBLIC_VAPID_PUBLIC_KEY="+k.publicKey);console.log("VAPID_PRIVATE_KEY="+k.privateKey)' >> "$GITHUB_ENV"
          rm /tmp/vapid.json
      # F7: WhatsApp contra una Graph API falsa (whatsapp.spec levanta el servidor en el 3901).
      # Valores desechables, nuevos en cada corrida; los reales solo viven en Vercel (regla 6).
      - name: WhatsApp de prueba
        run: |
          echo "WHATSAPP_ACCESS_TOKEN=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "WHATSAPP_PHONE_NUMBER_ID=100000000000001" >> "$GITHUB_ENV"
          echo "WHATSAPP_APP_SECRET=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "WHATSAPP_WEBHOOK_VERIFY_TOKEN=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "WHATSAPP_API_URL=http://127.0.0.1:3901" >> "$GITHUB_ENV"
      - run: pnpm --filter web test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
