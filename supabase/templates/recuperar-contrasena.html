<!doctype html>
<html lang="es-CO">
  <body style="font-family: Arial, sans-serif; font-size: 16px; line-height: 24px">
    <h1 style="font-size: 20px">Cambia tu contraseña</h1>
    <p>
      Pediste cambiar la contraseña de tu cuenta en Possos Barber. Toca el enlace para elegir una
      nueva:
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next={{ .RedirectTo }}"
        >Elegir una contraseña nueva</a
      >
    </p>
    <p>
      El enlace vence en una hora. Si no lo pediste, ignora este correo: tu contraseña sigue igual.
    </p>
  </body>
</html>
